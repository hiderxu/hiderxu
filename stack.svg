<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 830 160" width="830" height="160" role="img" aria-label="Tech stack: Python, Linux, Bash, Git, HTML, CSS, JavaScript" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.k{font:500 13px Consolas,'Courier New',monospace;fill:#8ea0c4;letter-spacing:2px}
.ct{font:600 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7fb;text-anchor:middle}
.chip{animation:pop .6s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="830" height="160" rx="18" fill="#070b16"/>
<text class="k" x="40" y="28">TECH STACK</text>
<g class="chip" style="animation-delay:.1s"><rect x="40" y="44" width="150" height="40" rx="20" fill="#0e1628" stroke="#247bff" stroke-width="1.5"/><text class="ct" x="115" y="70">Python</text></g>
<g class="chip" style="animation-delay:.2s"><rect x="210" y="44" width="150" height="40" rx="20" fill="#0e1628" stroke="#247bff" stroke-width="1.5"/><text class="ct" x="285" y="70">Linux</text></g>
<g class="chip" style="animation-delay:.3s"><rect x="380" y="44" width="150" height="40" rx="20" fill="#0e1628" stroke="#247bff" stroke-width="1.5"/><text class="ct" x="455" y="70">Bash</text></g>
<g class="chip" style="animation-delay:.4s"><rect x="550" y="44" width="150" height="40" rx="20" fill="#0e1628" stroke="#247bff" stroke-width="1.5"/><text class="ct" x="625" y="70">Git</text></g>
<g class="chip" style="animation-delay:.5s"><rect x="40" y="100" width="150" height="40" rx="20" fill="#0e1628" stroke="#ff354f" stroke-width="1.5"/><text class="ct" x="115" y="126">HTML</text></g>
<g class="chip" style="animation-delay:.6s"><rect x="210" y="100" width="150" height="40" rx="20" fill="#0e1628" stroke="#ff354f" stroke-width="1.5"/><text class="ct" x="285" y="126">CSS</text></g>
<g class="chip" style="animation-delay:.7s"><rect x="380" y="100" width="150" height="40" rx="20" fill="#0e1628" stroke="#ff354f" stroke-width="1.5"/><text class="ct" x="455" y="126">JavaScript</text></g>
</svg>
