<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 830 300" width="830" height="300" role="img" aria-label="Hider: defensive cyber security and ethical hacking" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.name{font:800 94px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7fb}
.mono{font:500 15px Consolas,'Courier New',monospace;fill:#8ea0c4}
.role{font:700 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#247bff}
.pitch{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c5cfe4}
.r1{opacity:1;animation:cyc 8s infinite}
.r2{opacity:0;animation:cyc 8s -4s infinite}
@keyframes cyc{0%,48%{opacity:1}52%,98%{opacity:0}100%{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes rise{from{transform:translateY(110px)}to{transform:none}}
.fu{animation:fu .8s ease both}
.fu2{animation:fu .8s ease .6s both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="hNameClip"><rect x="30" y="60" width="520" height="110"/></clipPath>
<clipPath id="hFace"><circle cx="730" cy="150" r="96"/></clipPath>
</defs>
<rect width="830" height="300" rx="18" fill="#070b16"/>
<text class="mono fu" x="40" y="48">HELLO, I'M</text>
<g clip-path="url(#hNameClip)"><text class="name rise" x="34" y="150">Hider</text></g>
<text class="role r1" x="40" y="196">Defensive Cyber Security</text>
<text class="role r2" x="40" y="196">Ethical Hacker</text>
<text class="pitch fu2" x="40" y="236">Stronger passwords, safer systems, and ethical hacking for good.</text>
<text class="mono fu2" x="40" y="272">MUNGER, BIHAR, INDIA  |  DROP ORGANISATION</text>
<image xlink:href="data:image/jpeg;base64," x="634" y="54" width="192" height="192" preserveAspectRatio="xMidYMid slice" clip-path="url(#hFace)"/>
<circle cx="730" cy="150" r="104" fill="none" stroke="#247bff" stroke-width="2"/>
</svg>
