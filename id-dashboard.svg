<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 830 360" width="830" height="360" role="img" aria-label="Hider ID badge on a lanyard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.drop{animation:drop 1.2s cubic-bezier(.3,1.3,.6,1) both}
@keyframes drop{from{transform:translateY(-300px)}to{transform:none}}
.lan{transform-origin:415px 0px;animation:damp 2.2s 1.2s both,sway 4.2s 3.4s ease-in-out infinite}
@keyframes damp{0%{transform:rotate(14deg)}30%{transform:rotate(-8deg)}55%{transform:rotate(4.5deg)}78%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes sway{0%,100%{transform:none}25%{transform:rotate(1.7deg)}75%{transform:rotate(-1.7deg)}}
.name{font:800 28px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7fb;text-anchor:middle}
.role{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#247bff;text-anchor:middle}
.sweep{animation:sweep 5s 3.4s ease-in-out infinite both}
@keyframes sweep{0%{transform:translateX(-220px)}60%,100%{transform:translateX(220px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="idMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f9"/><stop offset=".5" stop-color="#8d99b2"/><stop offset="1" stop-color="#e3e9f4"/></linearGradient>
<linearGradient id="idSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="idCard"><rect x="315" y="120" width="200" height="230" rx="16"/></clipPath>
<clipPath id="idPhoto"><circle cx="415" cy="204" r="44"/></clipPath>
<pattern id="idBars" width="6" height="10" patternUnits="userSpaceOnUse"><rect width="2" height="10" fill="#f5f7fb"/></pattern>
</defs>
<rect width="830" height="360" rx="18" fill="#070b16"/>
<g class="drop"><g class="lan">
<rect x="403" y="0" width="24" height="100" fill="#247bff"/>
<rect x="395" y="92" width="40" height="22" rx="4" fill="url(#idMetal)" stroke="#5b6780"/>
<rect x="315" y="120" width="200" height="230" rx="16" fill="#0e1628" stroke="#247bff" stroke-width="2"/>
<rect x="390" y="134" width="50" height="8" rx="4" fill="#070b16"/>
<circle cx="415" cy="204" r="46" fill="none" stroke="#247bff" stroke-width="2"/>
<image xlink:href="data:image/jpeg;base64," x="371" y="160" width="88" height="88" preserveAspectRatio="xMidYMid slice" clip-path="url(#idPhoto)"/>
<text class="name" x="415" y="290">Hider</text>
<text class="role" x="415" y="314">Cyber Security</text>
<rect x="355" y="326" width="120" height="16" fill="url(#idBars)"/>
<g clip-path="url(#idCard)"><rect class="sweep" x="315" y="120" width="200" height="230" fill="url(#idSheen)"/></g>
</g></g>
</svg>
