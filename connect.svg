<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 170" width="830" height="170" role="img" aria-label="Connect with Hider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.k{font:500 13px Consolas,'Courier New',monospace;fill:#8ea0c4;letter-spacing:2px}
.v{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7fb}
.u{font:400 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#247bff}
.card{fill:#0e1628;stroke:#247bff;stroke-width:1.5}
.fu{animation:fu .7s ease both}
.nudge{animation:nudge 2.2s ease-in-out infinite}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="830" height="170" rx="18" fill="#070b16"/>
<g class="fu">
<rect class="card" x="30" y="25" width="380" height="120" rx="16"/>
<text class="k" x="60" y="60">INSTAGRAM</text>
<text class="v" x="60" y="98">@hider.xu</text>
<text class="u" x="60" y="126">instagram.com/hider.xu</text>
<path class="nudge" d="M372 80h16M382 74l6 6-6 6" fill="none" stroke="#ff354f" stroke-width="2"/>
</g>
<g class="fu" style="animation-delay:.2s">
<rect class="card" x="420" y="25" width="380" height="120" rx="16"/>
<text class="k" x="450" y="60">WEBSITE</text>
<text class="v" x="450" y="98">hider.mywebsitee.online</text>
<text class="u" x="450" y="126">Password strength project</text>
<path class="nudge" d="M762 80h16M772 74l6 6-6 6" fill="none" stroke="#ff354f" stroke-width="2"/>
</g>
</svg>
