<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="830" height="220" role="img" aria-label="Capabilities and a rotating set of interests" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.card{fill:#0e1628;stroke:#1d2b47;stroke-width:1.5}
.k{font:500 13px Consolas,'Courier New',monospace;fill:#8ea0c4;letter-spacing:2px}
.t{font:700 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f7fb}
.li{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c5cfe4}
.s{opacity:0;animation:slide 12s infinite}
.s0{opacity:1;animation-delay:0s}
.s1{animation-delay:4s}
.s2{animation-delay:8s}
@keyframes slide{0%{opacity:0}2%,31%{opacity:1}34%,100%{opacity:0}}
.trk{fill:#1d2b47}
.fill{fill:#247bff;animation:bar 12s infinite both}
.f1{animation-delay:0s}
.f2{animation-delay:4s}
.f3{animation-delay:8s}
@keyframes bar{0%{transform:scaleX(0)}33%{transform:scaleX(1)}34%,100%{transform:scaleX(0)}}
.fill{transform-box:fill-box;transform-origin:left center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="830" height="220" rx="18" fill="#070b16"/>
<rect class="card" x="30" y="24" width="370" height="172" rx="16"/>
<text class="k" x="60" y="60">CAPABILITIES</text>
<text class="li" x="60" y="100">Defensive cyber security</text>
<text class="li" x="60" y="134">Ethical hacking</text>
<text class="li" x="60" y="168">Password strength checks</text>
<rect class="card" x="420" y="24" width="380" height="172" rx="16"/>
<g class="s s0"><text class="k" x="450" y="60">ROLE</text><text class="t" x="450" y="100">Defensive Cyber Security</text><text class="li" x="450" y="132">Protecting systems before attackers do.</text></g>
<g class="s s1"><text class="k" x="450" y="60">HOBBY</text><text class="t" x="450" y="100">Ethical Hacking</text><text class="li" x="450" y="132">Finding weak spots, with permission.</text></g>
<g class="s s2"><text class="k" x="450" y="60">PROJECT</text><text class="t" x="450" y="100">Password Strength</text><text class="li" x="450" y="132">Live at hider.mywebsitee.online</text></g>
<rect class="trk" x="450" y="164" width="100" height="4" rx="2"/>
<rect class="trk" x="562" y="164" width="100" height="4" rx="2"/>
<rect class="trk" x="674" y="164" width="100" height="4" rx="2"/>
<rect class="fill f1" x="450" y="164" width="100" height="4" rx="2"/>
<rect class="fill f2" x="562" y="164" width="100" height="4" rx="2"/>
<rect class="fill f3" x="674" y="164" width="100" height="4" rx="2"/>
</svg>
